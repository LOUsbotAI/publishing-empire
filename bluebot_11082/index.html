<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Lousta</title>
<style>
:root{
  --bg:#07080d;--bg2:#0d0f17;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#f2f3f8;--dim:#8d93a8;--faint:#5b6075;
  --a1:#8b5cf6;--a2:#3b82f6;--a3:#22d3ee;--grad:linear-gradient(135deg,#8b5cf6 0%,#3b82f6 55%,#22d3ee 100%);
  --up:#34d399;--warn:#fbbf24;--down:#f87171;
  --r:20px;--r2:14px;--shadow:0 10px 40px rgba(0,0,0,.45);
  --nav:76px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f5f6fb;--bg2:#ffffff;--card:rgba(15,20,40,.04);--card2:rgba(15,20,40,.07);
  --line:rgba(15,20,40,.08);--line2:rgba(15,20,40,.14);--text:#0f1222;--dim:#5d6378;--faint:#9aa0b4;
  --shadow:0 10px 40px rgba(20,30,60,.12)}}
:root[data-theme="light"]{
  --bg:#f5f6fb;--bg2:#ffffff;--card:rgba(15,20,40,.04);--card2:rgba(15,20,40,.07);
  --line:rgba(15,20,40,.08);--line2:rgba(15,20,40,.14);--text:#0f1222;--dim:#5d6378;--faint:#9aa0b4;
  --shadow:0 10px 40px rgba(20,30,60,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--a2);outline-offset:3px;border-radius:10px}
.glow{position:fixed;inset:-20% -20% auto;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(40% 50% at 20% 20%,rgba(139,92,246,.22),transparent 70%),
             radial-gradient(35% 45% at 85% 10%,rgba(34,211,238,.14),transparent 70%)}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(99,102,241,.45);flex:0 0 auto}
.mark svg{width:18px;height:18px}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--dim);margin-top:-2px}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--text);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.dot.UP{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.dot.ERROR{background:var(--warn)}.dot.DOWN,.dot.REFUSED_NON_LOCAL{background:var(--down)}
.dot.PLANNED{background:transparent;border:1.5px dashed var(--faint)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text)}
.iconbtn svg{width:18px;height:18px}

/* ---------- views ---------- */
.view{position:fixed;inset:0;overflow:auto;z-index:1;
  padding:calc(70px + env(safe-area-inset-top)) 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom));
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.view.on{opacity:1;transform:none;pointer-events:auto}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;margin:14px 0 6px}
h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);margin:0 0 18px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sec h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0}
.sec span{font-size:12px;color:var(--faint)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;color:var(--text)}
.stat{display:grid;gap:6px;min-height:92px;text-align:left;align-content:start}
.stat .k{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.02em}
.stat .m{font-size:11.5px;color:var(--faint);font-family:ui-monospace,SFMono-Regular,monospace}
.hero{grid-column:1/-1;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(59,130,246,.10) 60%,rgba(34,211,238,.08));border-color:var(--line2)}
.hero .v{font-size:26px}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{display:grid;gap:8px;justify-items:start;align-content:start;text-align:left;padding:14px;border-radius:var(--r2);
  background:var(--card);border:1px solid var(--line);min-height:96px;position:relative;transition:transform .12s,background .2s}
.tile:active{transform:scale(.97)}
.tile:hover{background:var(--card2)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--card2)}
.tile .t{font-size:13.5px;font-weight:550;line-height:1.2}
.tile .dot{position:absolute;top:12px;right:12px}
.tile.planned{border-style:dashed;opacity:.7}
.tile .tag{font-size:9.5px;letter-spacing:.06em;color:var(--warn);font-weight:600}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search svg{width:17px;height:17px;color:var(--dim)}

/* ---------- chat ---------- */
#chatView{padding-bottom:calc(var(--nav) + 104px + env(safe-area-inset-bottom))}
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;animation:pop .2s ease}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{border-color:color-mix(in srgb,var(--down) 50%,transparent)}
.msg .who{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.msg.me .who{color:rgba(255,255,255,.75)}
.msg .meta{display:block;margin-top:6px;font:11px ui-monospace,monospace;color:var(--faint)}
.msg pre{white-space:pre-wrap;margin:6px 0 0;font:12px/1.4 ui-monospace,monospace;color:var(--dim)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.empty{display:grid;gap:14px;margin-top:6vh}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px}
.composer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));z-index:15;
  max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;border-radius:24px;
  background:color-mix(in srgb,var(--bg2) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line2);box-shadow:var(--shadow)}
.composer textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:140px;padding:9px 0;line-height:1.4}
.send{width:42px;height:42px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.send:disabled{opacity:.4}
.send svg{width:18px;height:18px}

/* ---------- page viewer ---------- */
.viewer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.viewer.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.vbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg2)}
.vbar .ttl{flex:1;min-width:0}
.vbar .ttl b{display:block;font-size:15px}
.vbar .ttl span{display:block;font:11px ui-monospace,monospace;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frames{position:relative;flex:1;background:var(--bg)}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.frames iframe.on{display:block}
.vmsg{position:absolute;inset:0;display:grid;place-content:center;gap:12px;padding:28px;text-align:center;background:var(--bg)}
.vmsg h3{margin:0;font-size:19px}.vmsg p{margin:0 auto;color:var(--dim);max-width:420px}
.btn{height:44px;padding:0 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-weight:550}
.btn.pri{background:var(--grad);border:0;color:#fff}

/* ---------- nav ---------- */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;
  max-width:520px;margin:0 auto;height:64px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--line2);box-shadow:var(--shadow)}
.nav button{display:grid;place-items:center;align-content:center;gap:3px;border-radius:18px;font-size:11px;color:var(--dim);transition:background .2s,color .2s}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--text);background:var(--card2)}
.nav button[aria-current="page"] svg{color:var(--a1)}
body.viewing .nav{display:none}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:82dvh;overflow:auto;max-width:620px;margin:0 auto;
  background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;
  transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.svc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.svc b{font-size:14px}.svc small{display:block;color:var(--faint);font:11px ui-monospace,monospace}
.svc code{font:12px ui-monospace,monospace;color:var(--dim)}
.locks{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.locks span{font:10.5px ui-monospace,monospace;padding:5px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--dim)}

@media (min-width:900px){
  .bento{grid-template-columns:repeat(4,1fr)}
  .hero{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5a4.2 4.2 0 0 0-3.9 5.8A4.2 4.2 0 1 0 9.7 16.4L9 21.5h6l-.7-5.1a4.2 4.2 0 1 0 1.6-8.1A4.2 4.2 0 0 0 12 2.5z"/></svg></div>
    <div><b>Lousta</b><small id="viewName">Chat</small></div>
  </div>
  <div class="grow"></div>
  <button class="chip" id="statusBtn" aria-haspopup="dialog" aria-label="System status"><span class="dot" id="sDot"></span><span id="sText">…</span></button>
  <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<main class="view on" id="chatView" aria-label="Chat">
  <div class="wrap">
    <div class="empty" id="empty">
      <h1>Hey Louie.<br><span class="g">What are we building?</span></h1>
      <p class="sub">Talk to BlueBot. The team plans and drafts; anything live still goes through your Gate.</p>
      <div class="sugg">
        <button type="button">Status of every service</button>
        <button type="button">What is the next build step?</button>
        <button type="button">Ask Engineering to review the hub</button>
        <button type="button">Summarise today’s traces</button>
      </div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
  </div>
</main>
<form class="composer" id="composer" autocomplete="off">
  <textarea id="input" rows="1" placeholder="Message BlueBot…" aria-label="Message BlueBot"></textarea>
  <button class="send" id="sendBtn" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<main class="view" id="moreView" aria-label="Everything">
  <div class="wrap">
    <h1>Everything</h1>
    <p class="sub">Every BlueBot space in one place.</p>
    <div class="bento" id="bento"></div>
    <div class="sec"><h2>Find</h2></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search pages and spaces" aria-label="Search pages"></label>
    <div id="cats"></div>
  </div>
</main>

<section class="viewer" id="viewer" aria-label="Page viewer" aria-hidden="true">
  <div class="vbar">
    <button class="iconbtn" id="vBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="ttl"><b id="vTitle">Page</b><span id="vUrl"></span></div>
    <button class="iconbtn" id="vReload" aria-label="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
    <a class="iconbtn" id="vOpen" target="_blank" rel="noopener" aria-label="Open in browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  </div>
  <div class="frames" id="frames">
    <div class="vmsg" id="vMsg" hidden><h3 id="vMsgT"></h3><p id="vMsgP"></p><div><button class="btn pri" id="vForce" hidden>Load anyway</button></div></div>
  </div>
</section>

<nav class="nav" id="nav" aria-label="Main"></nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="statusSheet" role="dialog" aria-modal="true" aria-labelledby="stTitle" aria-hidden="true">
  <div class="grab"></div>
  <div class="sec" style="margin-top:0"><h2 id="stTitle">System</h2><button class="chip" id="stRefresh">Refresh</button></div>
  <div id="svcList"></div>
  <div class="locks"><span>PRODUCTION=LOCKED</span><span>SELF_APPROVAL=NO</span><span>MAX_EXECUTING=1</span><span>BRAIN=SUGGEST_ONLY</span><span>HUB=VIEW+CHAT_ONLY</span></div>
</section>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ICON={
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
 work:'<path d="M4 17l6-5-6-5M12 19h8"/>',
 build:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
 more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'};
const svg=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';

let cfg={modules:[]},health={},tab='chat',opener=null;
const frames=new Map();
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const recall=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const planned=m=>m.status==='PLANNED'||!m.url;
const portOf=u=>{try{const x=new URL(u);return +(x.port||80)}catch(e){return null}};
const isLocal=u=>{try{const x=new URL(u);return x.protocol==='http:'&&['127.0.0.1','localhost'].includes(x.hostname)}catch(e){return false}};
const stateOf=m=>planned(m)?'PLANNED':((health[portOf(m.url)]||{}).state||'UNKNOWN');
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const txt=(t,c,s)=>{const e=el(t,c);e.textContent=s;return e};

/* theme */
const savedTheme=recall('lousta.theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;
$('#themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  const nx=cur==='light'?'dark':'light';document.documentElement.dataset.theme=nx;store('lousta.theme',nx)};

/* nav: Chat | Code | Work | Build | More */
const NAV=[['chat','Chat'],['code','Code','loucode'],['work','Work','workbench'],['build','Build','workspace'],['more','More']];
NAV.forEach(([id,label,mod])=>{
  const b=el('button','',svg(id)+'<span></span>');b.lastChild.textContent=label;b.dataset.tab=id;
  b.onclick=()=>mod?openPage(mod,b):go(id);$('#nav').appendChild(b)});
function go(id){
  closeViewer(true);tab=id;
  $$('.view').forEach(v=>v.classList.toggle('on',v.id===id+'View'));
  $('#composer').hidden=id!=='chat';
  $('#viewName').textContent=id==='chat'?'Chat':'Everything';
  markNav(id);
}
function markNav(id){$$('#nav button').forEach(b=>b.dataset.tab===id?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))}

/* ---------- More view ---------- */
function renderMore(){
  const c=$('#cats');c.textContent='';
  const cats=[];cfg.modules.forEach(m=>{const k=m.category||'Other';if(!cats.includes(k))cats.push(k)});
  cats.forEach(k=>{
    const list=cfg.modules.filter(m=>(m.category||'Other')===k);
    const live=list.filter(m=>!planned(m)).length;
    const sec=el('div','sec');sec.dataset.cat=k;sec.append(txt('h2','',k),txt('span','',live?live+' pages':'planned'));
    const g=el('div','tiles');g.dataset.cat=k;
    list.forEach(m=>{
      const t=el('button','tile'+(planned(m)?' planned':''));t.dataset.id=m.id;
      t.append(el('span','dot'),txt('span','ic',m.icon||'•'),txt('span','t',m.label));
      if(planned(m)){t.append(txt('span','tag','PLANNED · NOT CONNECTED'));t.setAttribute('aria-label',m.label+', planned, not connected')}
      t.onclick=()=>openPage(m.id,t);g.appendChild(t)});
    c.append(sec,g)});
  paintDots();
}
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  $$('#cats .tiles').forEach(g=>{let n=0;
    g.querySelectorAll('.tile').forEach(t=>{const m=cfg.modules.find(x=>x.id===t.dataset.id);
      const hit=!q||(m.label+' '+(m.category||'')).toLowerCase().includes(q);t.hidden=!hit;if(hit)n++});
    g.hidden=!n;$('#cats .sec[data-cat="'+CSS.escape(g.dataset.cat)+'"]').hidden=!n})});
function paintDots(){$$('.tile').forEach(t=>{const m=cfg.modules.find(x=>x.id===t.dataset.id);if(m)t.querySelector('.dot').className='dot '+stateOf(m)})}

function renderBento(svcs){
  const b=$('#bento');b.textContent='';
  const up=svcs.filter(s=>s.state==='UP').length;
  const hero=el('button','card stat hero');
  hero.append(txt('span','k','System health'),txt('span','v',up+' of '+svcs.length+' services up'));
  const bar=el('div','bar','<i></i>');bar.firstChild.style.width=(svcs.length?up/svcs.length*100:0)+'%';hero.append(bar);
  hero.onclick=e=>openSheet(e.currentTarget);b.appendChild(hero);
  [[11880,'BlueBot'],[11770,'Owner Gate'],[11883,'Termux readback'],[11437,'Local model']].forEach(([p,name])=>{
    const s=svcs.find(x=>x.port===p)||{state:'UNKNOWN'};
    const c=el('div','card stat');const k=el('span','k');k.append(el('span','dot '+s.state),document.createTextNode(name));
    c.append(k,txt('span','v',s.state==='UP'?'Online':s.state==='DOWN'?'Offline':s.state==='ERROR'?'Needs check':'Unknown'),txt('span','m',':'+p+(s.code?' · '+s.ms+'ms':'')));
    b.appendChild(c)});
}

/* ---------- health ---------- */
async function refresh(){
  let d;try{d=await (await fetch('/hub/health',{cache:'no-store'})).json()}catch(e){$('#sText').textContent='hub offline';$('#sDot').className='dot DOWN';return}
  health={};d.services.forEach(s=>health[s.port]=s);
  const up=d.services.filter(s=>s.state==='UP').length,n=d.services.length;
  $('#sText').textContent=up+'/'+n+' up';$('#sDot').className='dot '+(up===n?'UP':up?'ERROR':'DOWN');
  const L=$('#svcList');L.textContent='';
  d.services.forEach(s=>{const r=el('div','svc');const mid=el('div');mid.append(txt('b','',s.role),txt('small','',':'+s.port));
    r.append(el('span','dot '+s.state),mid,txt('code','',s.code?('HTTP '+s.code+' · '+s.ms+'ms'):s.state));L.appendChild(r)});
  renderBento(d.services);paintDots();
}
$('#stRefresh').onclick=refresh;

/* ---------- sheet ---------- */
function openSheet(from){opener=from||document.activeElement;$('#scrim').classList.add('on');const s=$('#statusSheet');s.classList.add('on');s.setAttribute('aria-hidden','false');$('#stRefresh').focus()}
function closeSheet(){const s=$('#statusSheet');if(!s.classList.contains('on'))return;s.classList.remove('on');s.setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');if(opener&&opener.focus)opener.focus();opener=null}
$('#statusBtn').onclick=e=>openSheet(e.currentTarget);$('#scrim').onclick=closeSheet;

/* ---------- viewer: old pages full screen, one bar, Back returns ---------- */
let vOpener=null,current=null;
function openPage(id,from,force){
  const m=cfg.modules.find(x=>x.id===id);if(!m)return;
  current=id;if(from)vOpener=from;
  $('#vTitle').textContent=m.label;$('#vUrl').textContent=planned(m)?'PLANNED / NOT CONNECTED':m.url;
  $('#vOpen').hidden=planned(m);if(!planned(m))$('#vOpen').href=m.url;
  frames.forEach(f=>f.classList.remove('on'));
  const show=(t,p,retry)=>{$('#vMsgT').textContent=t;$('#vMsgP').textContent=p;$('#vForce').hidden=!retry;$('#vMsg').hidden=false};
  $('#vMsg').hidden=true;
  if(planned(m))show(m.label+' · Planned',(m.category||'This')+' space is reserved. Nothing is installed, connected or authorised yet. It goes live only after real runtime proof and your approval.',false);
  else if(!isLocal(m.url))show('Blocked','Only 127.0.0.1 pages can open here.',false);
  else if(!frames.has(id)&&stateOf(m)==='DOWN'&&!force)show(m.label+' is offline','Port '+portOf(m.url)+' isn’t answering. Start that service, then try again.',true);
  else{let f=frames.get(id);if(!f){f=document.createElement('iframe');f.title=m.label;f.src=m.url;
      f.setAttribute('allow','microphone; display-capture; clipboard-write');$('#frames').appendChild(f);frames.set(id,f)}
    f.classList.add('on')}
  const v=$('#viewer');v.classList.add('on');v.setAttribute('aria-hidden','false');document.body.classList.add('viewing');
  $('#composer').hidden=true;$('#vBack').focus();
}
function closeViewer(silent){
  const v=$('#viewer');if(!v.classList.contains('on'))return;
  v.classList.remove('on');v.setAttribute('aria-hidden','true');document.body.classList.remove('viewing');current=null;
  $('#composer').hidden=tab!=='chat';markNav(tab);
  if(!silent&&vOpener&&vOpener.focus)vOpener.focus();vOpener=null;
}
$('#vBack').onclick=()=>closeViewer();
$('#vReload').onclick=()=>{const f=frames.get(current);if(f)f.src=f.src;else if(current)openPage(current,null,true)};
$('#vForce').onclick=()=>openPage(current,null,true);

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('#statusSheet').classList.contains('on'))return closeSheet();
  if($('#viewer').classList.contains('on'))return closeViewer();
});

/* ---------- native chat (POST /hub/chat -> 11880 /api/chat) ---------- */
const input=$('#input'),msgs=$('#msgs');
const convId='conv_'+Date.now().toString(36);
function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';$('#sendBtn').disabled=!input.value.trim()}
input.addEventListener('input',grow);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();$('#composer').requestSubmit()}});
$$('.sugg button').forEach(b=>b.onclick=()=>{input.value=b.textContent;grow();input.focus()});
function bubble(kind,who,text){
  const d=el('div','msg '+kind);d.append(txt('span','who',who));const body=el('span');body.textContent=text;d.append(body);
  msgs.appendChild(d);$('#empty').hidden=true;d.scrollIntoView({behavior:'smooth',block:'end'});return d}
function pickReply(j){
  if(typeof j==='string')return j.trim()||null;if(!j||typeof j!=='object')return null;
  for(const k of ['reply','response','answer','text','message','content','output','result']){
    const v=j[k];if(typeof v==='string'&&v.trim())return v;if(v&&typeof v==='object'){const r=pickReply(v);if(r)return r}}
  return j.data?pickReply(j.data):null}
let busy=false;
$('#composer').addEventListener('submit',async e=>{
  e.preventDefault();const text=input.value.trim();if(!text||busy)return;busy=true;
  input.value='';grow();bubble('me','You',text);
  const wait=el('div','msg bot','<span class="who">BlueBot</span><span class="typing"><i></i><i></i><i></i></span>');msgs.appendChild(wait);wait.scrollIntoView({behavior:'smooth',block:'end'});
  const key=(cfg.chat&&cfg.chat.message_key)||'message';const trace='tr_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const payload={[key]:text,conversation_id:convId,trace_id:trace,source:'hub_11082'};
  const t0=performance.now();let j,code;
  try{const r=await fetch('/hub/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});code=r.status;
    const raw=await r.text();try{j=JSON.parse(raw)}catch(_){j=raw}}
  catch(err){code=0;j={error:'HUB_UNREACHABLE'}}
  wait.remove();busy=false;
  const ms=Math.round(performance.now()-t0);
  const reply=code>=200&&code<300?pickReply(j):null;
  const d=bubble(reply?'bot':'bot err','BlueBot',reply||(code===422||code===400?'BlueBot didn’t accept the message format. Set chat.message_key in modules.json (see README).':code===502||code===0?'BlueBot (11880) isn’t reachable right now.':'BlueBot returned HTTP '+code+'.'));
  if(!reply){const pre=el('pre');pre.textContent=typeof j==='string'?j.slice(0,600):JSON.stringify(j,null,1).slice(0,600);d.appendChild(pre)}
  const route=j&&typeof j==='object'?(j.route||j.department||j.lane||''):'';
  d.append(txt('span','meta',[trace,code?'HTTP '+code:'',ms+'ms',typeof route==='string'?route:''].filter(Boolean).join(' · ')));
});

/* ---------- boot ---------- */
(async()=>{
  try{cfg=await (await fetch('/modules.json',{cache:'no-store'})).json();cfg.modules=(cfg.modules||[]).filter(m=>m&&m.id&&(m.url||m.status==='PLANNED'))}catch(e){}
  renderMore();go('chat');await refresh();setInterval(refresh,15000);
})();
})();
</script>
